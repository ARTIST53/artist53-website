<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Half-Pint — School Daze | ARTIST53</title><link rel="stylesheet" href="styles.css"><style>.ill-page .ill-hero{display:grid;grid-template-columns:1fr;gap:34px;align-items:start}.ill-page .ill-copy{max-width:1000px}.ill-page .ill-copy h1{font-size:clamp(4.4rem,8vw,7.6rem);color:var(--yellow)}.ill-page .ill-copy p{color:var(--muted);line-height:1.7;font-size:1.18rem;max-width:850px}.standalone,.carousel-wrap{width:min(1180px,100%);margin:0 auto}.standalone img{display:block;width:100%;height:auto;cursor:zoom-in}.carousel{position:relative;aspect-ratio:1/1;background:#111;border:1px solid #2d2d2d;overflow:hidden}.carousel-slide{display:none;width:100%;height:100%;cursor:zoom-in}.carousel-slide.active{display:block}.carousel-slide img{width:100%;height:100%;object-fit:contain;background:#000}.carousel button.nav{position:absolute;top:50%;transform:translateY(-50%);width:64px;height:64px;border:2px solid #fff;background:rgba(0,0,0,.82);color:#fff;font-size:2.5rem;cursor:pointer;z-index:3}.carousel .prev{left:16px}.carousel .next{right:16px}.dots{display:flex;justify-content:center;gap:14px;margin-top:16px}.dots button{width:18px;height:18px;border-radius:50%;border:2px solid #fff;background:#555;padding:0;cursor:pointer}.dots button.active{background:var(--yellow)}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}.lightbox.open{display:flex}.lightbox img{max-width:98vw;max-height:96vh;width:auto;height:auto;object-fit:contain}.lightbox button{position:absolute;right:20px;top:16px;background:#000;border:2px solid #fff;color:#fff;font-size:2.5rem;line-height:1;width:52px;height:52px;cursor:pointer}</style></head><body class="ill-page"><header><div class="wrap nav"><a class="brand" href="index.html"><img src="artist53-wordmark.png" alt="ARTIST53"></a></div></header><main><section><div class="wrap ill-hero"><div class="ill-copy"><p class="eyebrow">Movies</p><h1>Half-Pint / School Daze</h1><p>Half-Pint from Spike Lee's <em>School Daze</em>, illustrated through the ARTIST53 lens.</p><a class="btn" href="illustration.html">Back To Illustration</a></div><div class="standalone"><img data-lightbox src="School.Daze(1).jpeg" alt="Half-Pint from School Daze standalone illustration"></div><div class="carousel-wrap"><div class="carousel" id="carousel"><div class="carousel-slide active" data-lightbox><img src="Instagram_School.Daze_web.jpg" alt="Half-Pint from School Daze full illustration"></div><div class="carousel-slide" data-lightbox><img src="Instagram_School.Daze2_web.jpg" alt="Half-Pint from School Daze portrait detail"></div><button class="nav prev" aria-label="Previous image">‹</button><button class="nav next" aria-label="Next image">›</button></div><div class="dots"><button class="active" aria-label="Show image 1"></button><button aria-label="Show image 2"></button></div></div></div></section></main><div class="lightbox" id="lightbox"><button aria-label="Close">×</button><img alt="Expanded artwork"></div><footer></footer><script src="script.js"></script><script>const slides=[...document.querySelectorAll('.carousel-slide')],dots=[...document.querySelectorAll('.dots button')];let i=0;function show(n){i=(n+slides.length)%slides.length;slides.forEach((s,x)=>s.classList.toggle('active',x===i));dots.forEach((d,x)=>d.classList.toggle('active',x===i))}document.querySelector('.prev').onclick=()=>show(i-1);document.querySelector('.next').onclick=()=>show(i+1);dots.forEach((d,x)=>d.onclick=()=>show(x));const lb=document.getElementById('lightbox'),lbImg=lb.querySelector('img');document.querySelectorAll('[data-lightbox]').forEach(el=>el.addEventListener('click',e=>{const img=e.currentTarget.tagName==='IMG'?e.currentTarget:e.currentTarget.querySelector('img');lbImg.src=img.src;lb.classList.add('open')}));lb.addEventListener('click',e=>{if(e.target===lb||e.target.tagName==='BUTTON')lb.classList.remove('open')});</script></body></html>
