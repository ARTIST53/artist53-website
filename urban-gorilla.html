<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Urban Gorilla | ARTIST53</title><link rel="stylesheet" href="styles.css"><style>.art{width:min(1180px,calc(100% - 40px));margin:34px auto 40px}.final-art{margin-bottom:22px}.final-art img{display:block;width:100%;height:auto;cursor:zoom-in}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.details img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;cursor:zoom-in;background:#000}.details img.title-card{object-position:44% center}@media(max-width:700px){.details{grid-template-columns:1fr}.art{width:min(100% - 24px,1180px)}}.lightbox{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:100;padding:12px}.lightbox.open{display:flex}.lightbox img{max-width:96vw;max-height:94vh;width:auto;height:auto;object-fit:contain}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img src="artist53-wordmark.png" alt="ARTIST53"></a><div class="nav-dropdown"><button class="nav-trigger" id="navTrigger" type="button" aria-expanded="false" aria-controls="navMenu"><span class="nav-label">Navigation</span><span class="hamburger" aria-hidden="true"><i></i><i></i><i></i></span></button><nav class="dropdown-menu" id="navMenu"><a href="index.html">Home</a><a href="logo-design.html">Logo Design</a><a href="illustration.html" class="active">Illustration</a><a href="character-design.html">Character Design</a><a href="vector-lounge.html">The Vector Lounge</a><a href="learning.html">Learning</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></div></div></header><main><section><div class="wrap"><p class="eyebrow">Original Work</p><h1 class="title">Urban Gorilla</h1><p>Original gorilla illustration presented across four camo treatments.</p><a class="btn" href="illustration.html">Back To Illustration</a></div><div class="art"><div class="final-art"><img data-lightbox src="Instagram_Gorilla_wood_web.jpg" alt="Urban Gorilla woodland camo final illustration"></div><div class="details"><img data-lightbox src="Instagram_Gorilla_urban_web.jpg" alt="Urban Gorilla urban camo"><img data-lightbox src="Instagram_Gorilla_digital_web.jpg" alt="Urban Gorilla digital camo"><img data-lightbox src="Instagram_Gorilla_dessert_web.jpg" alt="Urban Gorilla desert camo"><img class="title-card" data-lightbox src="URBAN.GORILLA.png" alt="Urban Gorilla title card"></div></div></section></main><div class="lightbox" id="lb"><img alt="Expanded artwork"></div><footer></footer><script src="script.js"></script><script>const lb=document.getElementById('lb'),li=lb.querySelector('img');document.querySelectorAll('[data-lightbox]').forEach(i=>i.onclick=()=>{li.src=i.src;lb.classList.add('open')});lb.onclick=()=>lb.classList.remove('open');document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('open')});</script></body></html>
