<!doctype html><meta name="robots" content="noindex,nofollow"><title>Mobile layout verification</title><style>body{font:16px system-ui;background:#eee;color:#111;margin:20px}button,select{font:inherit;padding:10px}#frames{display:flex;gap:12px;flex-wrap:wrap}iframe{border:2px solid #999;flex:none}pre{white-space:pre-wrap}#results{max-height:500px;overflow:auto}</style><h1>Mobile layout verification</h1><p id="status">Ready</p><button id="run">Run all pages</button><select id="page"></select><select id="size"><option value="320,568">320 × 568</option><option value="390,844">390 × 844</option><option value="430,932">430 × 932</option><option value="844,390">844 × 390</option><option value="768,1024">768 × 1024</option></select><button id="preview">Preview selected page</button><pre id="results"></pre><div id="frames"></div><script>
const pages=["albo.html", "ving-rhames-man-at-arms.html", "battle-cat.html", "logo-manhood-basic-training.html", "school-daze-half-pint.html", "learning.html", "teela.html", "urban-gorilla.html", "logo-peaceful-shores.html", "joker.html", "tmnt.html", "index.html", "logo-shooters-circle.html", "sorceress.html", "logo-night-owl-automotive.html", "logo-marquis-grissom.html", "leonardo.html", "logo-sessions-off-safety.html", "raphael.html", "logo-clik-clik-bang.html", "illustration.html", "dtm.html", "ryu-street-fighter.html", "barack-obama.html", "spider-man.html", "logo-hush-hush-squad.html", "logo-design.html", "brand-identity.html", "blade.html", "lord-beerus.html", "privacy.html", "logo-i-think-i-am-foundation.html", "stone-mountain-dental.html", "game-over.html", "kill-bill.html", "star-wars-darth-maul.html", "vector-lounge.html", "tshirt-design.html", "evil-lyn.html", "kangaroo-jack.html", "captain-planet.html", "master-roshi.html", "character-design.html", "flava-dave.html", "atlanta-brave.html", "logo-bombshell-boulevard.html", "batman-calling-cards.html", "logo-left-side-lion.html", "logo-k9-kreedentials.html", "shredder-2.html", "thor.html", "star-wars-darth-vader.html", "logo-trinity-telecom.html", "logo-hero-da-barber.html", "logo-alexander-photos.html", "ghost-rider.html", "batman-superman.html", "tien.html", "star-wars-stormtrooper.html", "contact.html", "about.html", "services.html", "shop.html", "space-brothers.html", "black-panther-chadwick-boseman.html", "shredder.html", "venom.html", "sticky-paws.html"], sizes=[[320,568],[390,844],[430,932],[844,390],[768,1024]];
const out=document.querySelector('#results'), status=document.querySelector('#status'), frames=document.querySelector('#frames');
for(const p of pages)document.querySelector('#page').add(new Option(p,p));
const delay=ms=>new Promise(r=>setTimeout(r,ms));
async function frame(p,w,h){const f=document.createElement('iframe');f.width=w;f.height=h;f.title=p+' '+w+'x'+h;frames.append(f);let loaded=new Promise(r=>{f.onload=r;setTimeout(r,15000)});f.src=p;await loaded;const d=f.contentDocument;await Promise.race([d.fonts.ready,delay(2000)]);d.querySelectorAll('img').forEach(i=>i.loading='eager');await Promise.race([Promise.all([...d.images].map(i=>i.complete?Promise.resolve():new Promise(r=>{i.onload=r;i.onerror=r}))),delay(8000)]);await delay(120);return f;}
function inspect(f,p,w,h){const d=f.contentDocument,win=f.contentWindow;const bad=[],tall=[],broken=[];let count=0;
for(const i of d.images){if(!i.getAttribute('src'))continue;const r=i.getBoundingClientRect();if(r.width<1||r.height<1||win.getComputedStyle(i).visibility==='hidden')continue;count++;if(!i.naturalWidth)broken.push(i.getAttribute('src'));const parent=i.parentElement;const clip=win.getComputedStyle(parent).overflow;const intentional=!!i.closest('.card-image,.before-after-track,.learning-carousel-track,.learning-track,.learning-carousel');if((r.left < -1 || r.right>w+1)&&!intentional)bad.push({src:i.getAttribute('src'),x:Math.round(r.x),width:Math.round(r.width),parent:parent.className,clip});if(r.height>h-100)tall.push({src:i.getAttribute('src'),height:Math.round(r.height),parent:parent.className});}
const overflow=[...d.querySelectorAll('body *')].filter(e=>{const r=e.getBoundingClientRect(),c=win.getComputedStyle(e);return r.width>0&&r.right>w+2&&c.position!=='fixed'&&!e.closest('.artist53-lightbox,.lightbox,.service-marquee,.logo-hero-points-track,.before-after-track,.learning-track,.learning-carousel,.card-image')}).slice(0,8).map(e=>e.tagName+'.'+e.className);
return {page:p,size:[w,h],images:count,scrollWidth:d.documentElement.scrollWidth,bad,tall,broken,overflow};}
document.querySelector('#preview').onclick=async()=>{frames.replaceChildren();const [w,h]=document.querySelector('#size').value.split(',').map(Number);await frame(document.querySelector('#page').value,w,h);status.textContent='Preview ready'};
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;out.textContent='';window.auditResults=[];let completed=0;for(const p of pages){frames.replaceChildren();await Promise.all(sizes.map(async([w,h])=>{try{const f=await frame(p,w,h);window.auditResults.push(inspect(f,p,w,h));}catch(e){window.auditResults.push({page:p,size:[w,h],error:String(e)})}completed++;status.textContent=completed+' / '+pages.length*sizes.length+' layouts checked';}));out.textContent=JSON.stringify(window.auditResults.filter(r=>r.error||r.bad.length||r.tall.length||r.broken.length||r.scrollWidth>r.size[0]+1));}status.textContent='Complete: '+completed+' layouts checked';document.querySelector('#run').disabled=false;};
</script>
