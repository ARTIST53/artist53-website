<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teela | ARTIST53</title><link rel="stylesheet" href="styles.css"><style>.art{width:min(1180px,100%);margin:30px auto}.art>img,.grid img{display:block;width:100%;height:auto;cursor:zoom-in}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.lightbox{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:100}.lightbox.open{display:flex}.lightbox img{max-width:96vw;max-height:94vh}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img src="artist53-wordmark.png" alt="ARTIST53"></a></div></header><main><section><div class="wrap"><p class="eyebrow">Masters of the Universe</p><h1 class="title">Teela</h1><p>ARTIST53 interpretation of Teela.</p><a class="btn" href="illustration.html">Back To Illustration</a><div class="art"><img data-lightbox src="TELA1.1_web.jpg" alt="Teela full illustration"><div class="grid"><img data-lightbox src="TELA2_web.jpg" alt="Teela portrait detail"><img data-lightbox src="TELA3_web.jpg" alt="Teela armor detail"><img data-lightbox src="20170504_183053_web.jpg" alt="Teela process image"><img data-lightbox src="20170503_024654_web.jpg" alt="Teela process image"></div></div></div></section></main><div class="lightbox" id="lb"><img alt="Expanded artwork"></div><footer></footer><script src="script.js"></script><script>const lb=document.getElementById('lb'),li=lb.querySelector('img');document.querySelectorAll('[data-lightbox]').forEach(i=>i.onclick=()=>{li.src=i.src;lb.classList.add('open')});lb.onclick=()=>lb.classList.remove('open');</script></body></html>
