<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DTM | Atlanta Artist Series | ARTIST53</title><link rel="stylesheet" href="styles.css?v=20260830-hydro-viewer-3"><style>.ill-page .ill-copy{max-width:1000px}.ill-page .ill-copy h1{font-size:clamp(4.8rem,9vw,8rem);color:var(--yellow)}.ill-page .ill-copy p{color:var(--muted);line-height:1.7;font-size:1.18rem;max-width:850px}.art-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:34px}.ill-art{background:#111;border:1px solid #2d2d2d;overflow:hidden;cursor:zoom-in}.ill-art:first-child{grid-column:1/-1}.ill-art img{display:block;width:100%;height:auto;object-fit:contain}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}.lightbox.open{display:flex}.lightbox img{max-width:98vw;max-height:96vh;width:auto;height:auto;object-fit:contain}.lightbox button{position:absolute;right:20px;top:16px;background:#000;border:2px solid #fff;color:#fff;font-size:2.5rem;line-height:1;width:52px;height:52px;cursor:pointer}@media(max-width:720px){.art-grid{grid-template-columns:1fr}.ill-art:first-child{grid-column:auto}}</style></head><body class="ill-page"><header><div class="wrap nav"><a class="brand" href="index.html"><img src="artist53-wordmark.png" alt="ARTIST53"></a><div class="nav-dropdown"><button class="nav-trigger" id="navTrigger" type="button" aria-expanded="false" aria-controls="navMenu"><span class="nav-label">Navigation</span><span class="hamburger" aria-hidden="true"><i></i><i></i><i></i></span></button><nav class="dropdown-menu" id="navMenu"><a href="index.html">Home</a><a href="logo-design.html">Logo Design</a><a href="illustration.html" class="active">Illustration</a><a href="character-design.html">Character Design</a><a href="vector-lounge.html">The Vector Lounge</a><a href="learning.html">Learning</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></div></div></header><main><section><div class="wrap"><div class="ill-copy"><p class="eyebrow">ATLANTA ARTIST SERIES</p><h1>DTM</h1><p>Portrait artwork from the ARTIST53 Atlanta Artist Series.</p><a class="btn" href="illustration.html">Back To Illustration</a></div><div class="art-grid"><div class="ill-art" data-lightbox><img src="atlanta-artist-series-dtm-title-card.webp" alt="DTM Atlanta Artist Series title card"></div><div class="ill-art" data-lightbox><img src="atlanta-artist-series-dtm-01.webp" alt="DTM portrait by ARTIST53"></div><div class="ill-art" data-lightbox><img src="atlanta-artist-series-dtm-02.webp" alt="DTM portrait detail by ARTIST53"></div><div class="ill-art" data-lightbox><img src="atlanta-artist-series-dtm-03.webp" alt="DTM portrait variation by ARTIST53"></div></div></div></section></main><div class="lightbox" id="lightbox"><button aria-label="Close">×</button><img alt="Expanded artwork"></div><footer></footer><script src="script.js?v=20260830-hydro-viewer-3"></script><script>const lb=document.getElementById('lightbox'),lbImg=lb.querySelector('img');document.querySelectorAll('[data-lightbox]').forEach(el=>el.addEventListener('click',()=>{lbImg.src=el.querySelector('img').src;lb.classList.add('open')}));lb.addEventListener('click',e=>{if(e.target===lb||e.target.tagName==='BUTTON')lb.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('open')});</script></body></html>
