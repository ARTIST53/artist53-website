<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title description">
  <title id="title">What Makes a Great Logo?</title>
  <desc id="description">ARTIST53 Logo Learning introduction to six tests: simple, memorable, readable, versatile, relevant and unique.</desc>
  <defs>
    <style>
      .display { font-family: "Bebas Neue", Impact, "Arial Narrow", sans-serif; font-weight: 700; }
      .label { font-family: Arial, Helvetica, sans-serif; font-weight: 800; letter-spacing: 5px; }
    </style>
  </defs>
  <image href="learning-great-logo-background.webp" x="0" y="0" width="1254" height="1254" preserveAspectRatio="xMidYMid slice"/>
  <g fill="#070707">
    <text class="label" x="86" y="112" font-size="27">ARTIST53 LOGO LEARNING / STAGE 01</text>
    <rect x="86" y="146" width="1082" height="8"/>
    <text class="display" x="78" y="356" font-size="180" letter-spacing="-3">WHAT MAKES</text>
    <text class="display" x="78" y="530" font-size="180" letter-spacing="-3">A GREAT LOGO?</text>
    <text class="display" x="86" y="711" font-size="61">SIMPLE</text>
    <text class="display" x="420" y="711" font-size="61">MEMORABLE</text>
    <text class="display" x="880" y="711" font-size="61">READABLE</text>
    <text class="display" x="86" y="849" font-size="61">VERSATILE</text>
    <text class="display" x="510" y="849" font-size="61">RELEVANT</text>
    <text class="display" x="914" y="849" font-size="61">UNIQUE</text>
  </g>
  <g fill="none" stroke="#070707" stroke-width="4">
    <line x1="86" y1="745" x2="342" y2="745"/>
    <line x1="420" y1="745" x2="790" y2="745"/>
    <line x1="880" y1="745" x2="1168" y2="745"/>
    <line x1="86" y1="883" x2="412" y2="883"/>
    <line x1="510" y1="883" x2="828" y2="883"/>
    <line x1="914" y1="883" x2="1168" y2="883"/>
  </g>
  <g fill="#070707">
    <circle cx="86" cy="1038" r="10"/>
    <text class="label" x="116" y="1048" font-size="26">SIX TESTS. ONE STRONGER MARK.</text>
  </g>
</svg>
