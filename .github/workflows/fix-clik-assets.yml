name: Repair CLIK assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-clik-assets.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore original CLIK assets as normal JPG files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin backup-before-recovery-20260815:refs/remotes/origin/backup-before-recovery-20260815

          # Identity and Opening Day: untouched original JPGs from the backup branch.
          git show origin/backup-before-recovery-20260815:clik-identity-original.jpg > clik-identity-original.jpg
          git show origin/backup-before-recovery-20260815:clik-opening-day.jpg > clik-social-opening-day.jpg

          # Bang N Buy: decode the original stored image payloads ONCE into ordinary JPGs.
          git show origin/backup-before-recovery-20260815:public/bang-buy-event-logo-social.jpg.b64 > /tmp/event.b64
          git show origin/backup-before-recovery-20260815:public/bang-buy-food-trucks-raffle.final.b64 > /tmp/food.b64
          git show origin/backup-before-recovery-20260815:public/bang-buy-influencer-black-rambo.final.b64 > /tmp/rambo.b64
          git show origin/backup-before-recovery-20260815:public/bang-buy-sponsors.final.b64 > /tmp/sponsors.b64

          python - <<'PY'
          from pathlib import Path
          import base64, re
          from PIL import Image

          payloads = {
              '/tmp/event.b64': 'bang-buy-event-logo.jpg',
              '/tmp/food.b64': 'bang-buy-food-raffle.jpg',
              '/tmp/rambo.b64': 'bang-buy-black-rambo.jpg',
              '/tmp/sponsors.b64': 'bang-buy-sponsors.jpg',
          }

          for source, target in payloads.items():
              text = Path(source).read_text(encoding='utf-8')
              text = re.sub(r'[^A-Za-z0-9+/=]', '', text)
              text += '=' * ((4 - len(text) % 4) % 4)
              data = base64.b64decode(text, validate=False)
              Path(target).write_bytes(data)

          required = [
              'clik-identity-original.jpg',
              'clik-social-opening-day.jpg',
              'clik-social-selection.jpg',
              'clik-social-giveaway.jpg',
              'bang-buy-event-logo.jpg',
              'bang-buy-food-raffle.jpg',
              'bang-buy-black-rambo.jpg',
              'bang-buy-sponsors.jpg',
          ]

          for path in required:
              with Image.open(path) as im:
                  im.verify()
              with Image.open(path) as im:
                  w, h = im.size
                  if w < 100 or h < 100:
                      raise RuntimeError(f'{path} is unexpectedly small: {w}x{h}')
                  print(f'VALID {path}: {w}x{h}')
          PY

          # Force browsers/CDN to request the repaired images.
          python - <<'PY'
          from pathlib import Path
          p = Path('logo-clik-clik-bang.html')
          s = p.read_text(encoding='utf-8')
          import re
          s = re.sub(r'\?v=20260816-[0-9]+', '?v=20260816-3', s)
          p.write_text(s, encoding='utf-8')
          PY

          # Remove all temporary repair debris from prior attempts.
          rm -rf .fresh-clik .tmp-clik .tmp-clik4 .tmp-clik-* || true
          rm -f .github/workflows/materialize-clik-images.yml \
                .github/workflows/install-clik-originals.yml \
                .github/workflows/finalize-clik-assets.yml || true
          rm -f .github/workflows/fix-clik-assets.yml

      - name: Commit repaired static assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish CLIK case study image repair"
          git push origin HEAD:main
