name: Materialize CLIK images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-clik-images.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Decode original image uploads
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode bang-buy-teaser.b64 > bang-buy-teaser.jpg
          base64 --decode bang-buy-event-logo.b64 > bang-buy-event-identity.jpg
          base64 --decode bang-buy-food-raffle.b64 > bang-buy-food-trucks-raffle.jpg
          base64 --decode bang-buy-bang-out.b64 > bang-buy-bang-out.jpg
          base64 --decode bang-buy-black-rambo.b64 > bang-buy-black-rambo.jpg
          base64 --decode bang-buy-nina.b64 > bang-buy-nina-de-la-flores.jpg
          base64 --decode bang-buy-method.b64 > bang-buy-method-endeavors.jpg
          base64 --decode bang-buy-sponsors.b64 > bang-buy-vendors-sponsors.jpg
          file bang-buy-*.jpg
      - name: Commit normal JPG files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bang-buy-*.jpg
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Add CLIK Bang N Buy JPG originals"
          git push origin HEAD:main
