name: Materialize CLIK images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-clik-images.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Create normal JPG artwork files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, re

          # Bang N Buy uploads stored as raw base64 data.
          bang = {
              'bang-buy-teaser.b64': 'bang-buy-teaser.jpg',
              'bang-buy-event-logo.b64': 'bang-buy-event-identity.jpg',
              'bang-buy-food-raffle.b64': 'bang-buy-food-trucks-raffle.jpg',
              'bang-buy-bang-out.b64': 'bang-buy-bang-out.jpg',
              'bang-buy-black-rambo.b64': 'bang-buy-black-rambo.jpg',
              'bang-buy-nina.b64': 'bang-buy-nina-de-la-flores.jpg',
              'bang-buy-method.b64': 'bang-buy-method-endeavors.jpg',
              'bang-buy-sponsors.b64': 'bang-buy-vendors-sponsors.jpg',
          }
          for source, target in bang.items():
              text = re.sub(r'[^A-Za-z0-9+/=]', '', Path(source).read_text().strip())
              text += '=' * ((4 - len(text) % 4) % 4)
              data = base64.b64decode(text, validate=False)
              if not data.startswith(b'\xff\xd8\xff'):
                  raise RuntimeError(f'{source} did not decode to JPEG')
              Path(target).write_bytes(data)

          # Store-opening social uploads are embedded JPEGs in the temporary SVG holders.
          social = {
              'clik-social-opening-day.svg': 'clik-social-opening-day.jpg',
              'clik-social-selection.svg': 'clik-social-selection.jpg',
              'clik-social-giveaway.svg': 'clik-social-giveaway.jpg',
          }
          for source, target in social.items():
              text = Path(source).read_text()
              match = re.search(r'base64,([^\"]+)', text)
              if not match:
                  raise RuntimeError(f'No embedded JPEG found in {source}')
              data = base64.b64decode(match.group(1))
              if not data.startswith(b'\xff\xd8\xff'):
                  raise RuntimeError(f'{source} did not contain JPEG data')
              Path(target).write_bytes(data)
          PY

          # Packaging exists as a normal raster image; convert once to JPG for the final simple page.
          python - <<'PY'
          from PIL import Image
          Image.open('clik-logo-packaging.webp').convert('RGB').save('clik-logo-packaging.jpg', quality=95)
          PY

      - name: Commit JPG files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clik-social-opening-day.jpg clik-social-selection.jpg clik-social-giveaway.jpg clik-logo-packaging.jpg bang-buy-*.jpg
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Add CLIK case study JPG artwork"
          git push origin HEAD:main
