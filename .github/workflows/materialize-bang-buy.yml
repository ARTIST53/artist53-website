name: Materialize Bang N Buy campaign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-bang-buy.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Decode campaign artwork into standard JPGs
        shell: bash
        run: |
          set -euo pipefail
          decode () {
            src="$1"
            dst="$2"
            tr -d '\r\n\t ' < "$src" | base64 --decode > "$dst"
            test -s "$dst"
            file "$dst"
          }

          decode bang-buy-teaser.b64 bang-buy-teaser.jpg
          decode bang-buy-event-logo.b64 bang-buy-event-logo.jpg
          decode bang-buy-food-raffle.b64 bang-buy-food-raffle.jpg
          decode bang-buy-bang-out.b64 bang-buy-bang-out.jpg
          decode bang-buy-black-rambo.b64 bang-buy-black-rambo.jpg
          decode bang-buy-nina.b64 bang-buy-nina.jpg
          decode bang-buy-method.b64 bang-buy-method.jpg
          decode bang-buy-sponsors.b64 bang-buy-sponsors.jpg

          rm -f .github/workflows/materialize-bang-buy.yml

      - name: Commit standard campaign images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete Bang N Buy JPG campaign set"
          git push origin HEAD:main
