name: Install Manhood Originals

on:
  push:
    paths:
      - 'manhood-upload/READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check ready marker
        id: ready
        shell: bash
        run: |
          if [ ! -f manhood-upload/READY ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild clean Manhood assets
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat manhood-upload/part-* > /tmp/manhood.b64
          base64 --decode /tmp/manhood.b64 > /tmp/manhood-assets.zip
          echo "9b5ac475008c7de1302451baac80744cbae768a52645ec759d6e1a105d36a9c7  /tmp/manhood-assets.zip" | sha256sum -c -
          unzip -o /tmp/manhood-assets.zip -d .
          rm -rf manhood-upload manhood-b64
          rm -f manhood-assets-loader.js manhood-assets-sprite.webp manhood-inline.css manhood-master-sprite.jpg manhood-sprite-fixed.jpg
          rm -f manhood-data-*.txt manhood-proof-directions.webp manhood-sketch-exploration.webp
          rm -f _tmp_should_not_use.txt
          git config user.name "ARTIST53 Site Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Install clean Manhood assets and remove failed loaders"
          git push
