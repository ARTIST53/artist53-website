name: Install Manhood Originals

on:
  push:
    paths:
      - 'manhood-fetch/links.env'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch original Manhood assets
        shell: bash
        run: |
          set -euo pipefail
          source manhood-fetch/links.env

          curl -L --fail --retry 2 "$SKETCHES" -o manhood-sketches.jpg
          curl -L --fail --retry 2 "$CHOSEN" -o manhood-proof.jpg
          curl -L --fail --retry 2 "$SYSTEM" -o manhood-system.jpg

          curl -L --fail --retry 2 "$FULL_BLACK" -o manhood-full-black.png
          curl -L --fail --retry 2 "$FULL_GOLD" -o manhood-full-gold.png
          curl -L --fail --retry 2 "$FULL_RED" -o manhood-full-red.png
          curl -L --fail --retry 2 "$FULL_BROWN" -o manhood-full-brown.png
          curl -L --fail --retry 2 "$FULL_WHITE" -o manhood-full-white.png

          curl -L --fail --retry 2 "$WORD_BLACK_GOLD" -o manhood-wordmark-black-gold.png
          curl -L --fail --retry 2 "$WORD_GOLD" -o manhood-wordmark-gold.png
          curl -L --fail --retry 2 "$WORD_RED" -o manhood-wordmark-red.png
          curl -L --fail --retry 2 "$WORD_BROWN" -o manhood-wordmark-brown.png

          file manhood-sketches.jpg manhood-proof.jpg manhood-system.jpg manhood-full-black.png manhood-full-white.png

          rm -f manhood-full-black.jpg manhood-full-gold.jpg manhood-full-red.jpg manhood-full-brown.jpg manhood-full-white.jpg
          rm -f manhood-wordmark-black-gold.jpg manhood-wordmark-gold.jpg manhood-wordmark-red.jpg manhood-wordmark-brown.jpg
          rm -f manhood-assets-loader.js manhood-assets-sprite.webp manhood-inline.css manhood-master-sprite.jpg manhood-sprite-fixed.jpg
          rm -f manhood-data-*.txt manhood-proof-directions.webp manhood-sketch-exploration.webp manhood-system.jpeg
          rm -f _tmp_should_not_use.txt
          rm -rf manhood-upload manhood-b64 manhood-fetch

          python3 - <<'PY'
          from pathlib import Path
          p=Path('logo-manhood-basic-training.html')
          s=p.read_text()
          replacements={
            'manhood-full-black.jpg':'manhood-full-black.png',
            'manhood-full-gold.jpg':'manhood-full-gold.png',
            'manhood-full-red.jpg':'manhood-full-red.png',
            'manhood-full-brown.jpg':'manhood-full-brown.png',
            'manhood-full-white.jpg':'manhood-full-white.png',
            'manhood-wordmark-black-gold.jpg':'manhood-wordmark-black-gold.png',
            'manhood-wordmark-gold.jpg':'manhood-wordmark-gold.png',
            'manhood-wordmark-red.jpg':'manhood-wordmark-red.png',
            'manhood-wordmark-brown.jpg':'manhood-wordmark-brown.png',
          }
          for old,new in replacements.items():
              s=s.replace(old,new)
          s=s.replace('v=20260814-individual2','v=20260814-originals')
          p.write_text(s)
          PY

          git config user.name "ARTIST53 Site Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Install original Manhood assets from source files"
          git push
