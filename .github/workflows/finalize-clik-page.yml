name: Finalize CLIK case study

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-clik-page.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build normal JPG assets and update page
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, re

          # Decode the original stored campaign uploads into ordinary JPG files.
          mappings = {
              'bang-buy-teaser.b64': 'bang-buy-teaser.jpg',
              'bang-buy-event-logo.b64': 'bang-buy-event-logo.jpg',
              'bang-buy-food-raffle.b64': 'bang-buy-food-raffle.jpg',
              'bang-buy-bang-out.b64': 'bang-buy-bang-out.jpg',
              'bang-buy-black-rambo.b64': 'bang-buy-black-rambo.jpg',
              'bang-buy-nina.b64': 'bang-buy-nina.jpg',
              'bang-buy-method.b64': 'bang-buy-method.jpg',
              'bang-buy-sponsors.b64': 'bang-buy-sponsors.jpg',
          }

          for src, dst in mappings.items():
              raw = Path(src).read_text(encoding='utf-8', errors='ignore')
              cleaned = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
              start = cleaned.find('/9j/')
              if start > 0:
                  cleaned = cleaned[start:]
              cleaned += '=' * ((4 - len(cleaned) % 4) % 4)
              data = base64.b64decode(cleaned, validate=False)
              if not data.startswith(b'\xff\xd8\xff') or len(data) < 3000:
                  raise RuntimeError(f'{src} did not decode to a valid JPEG ({len(data)} bytes)')
              Path(dst).write_bytes(data)
              print(f'{dst}: {len(data)} bytes')

          page = Path('logo-clik-clik-bang.html')
          html = page.read_text(encoding='utf-8')

          # Keep the existing 4-card logo presentation untouched; add the palette board beneath it.
          if 'clik-final-identity-board.jpg?v=20260817-complete' not in html:
              identity_end = '    </div>\n  </section>\n\n  <section id="use"'
              board = '''    </div>\n    <figure class="art identity-board" style="margin-top:28px"><img src="clik-final-identity-board.jpg?v=20260817-complete" alt="CLIK CLIK BANG final logo set and color palette"><figcaption>Final Identity + Color System</figcaption></figure>\n  </section>\n\n  <section id="use"'''
              if identity_end not in html:
                  raise RuntimeError('Could not find identity section insertion point')
              html = html.replace(identity_end, board, 1)

          # Correct Store Opening social graphics: Opening Day, Selection, Giveaway.
          html = re.sub(r'clik-opening-day\.jpg\?v=[^"\']+', 'clik-social-opening-day.jpg?v=20260817-complete', html)
          html = re.sub(r'clik-social-opening-day\.jpg\?v=[^"\']+', 'clik-social-opening-day.jpg?v=20260817-complete', html)
          html = re.sub(r'clik-social-selection\.jpg\?v=[^"\']+', 'clik-social-selection.jpg?v=20260817-complete', html)
          html = re.sub(r'clik-social-giveaway\.jpg\?v=[^"\']+', 'clik-social-giveaway.jpg?v=20260817-complete', html)

          # Replace the Bang N Buy runtime-loaded cards with direct local JPG files.
          bang_grid = '''<div class="grid four" id="bangCampaign">\n      <figure class="art event-card"><img src="bang-buy-teaser.jpg?v=20260817-complete" alt="Bang N Buy teaser artwork"></figure>\n      <figure class="art event-card"><img src="bang-buy-event-logo.jpg?v=20260817-complete" alt="Bang N Buy event identity"></figure>\n      <figure class="art event-card"><img src="bang-buy-food-raffle.jpg?v=20260817-complete" alt="Bang N Buy food trucks and raffle promotion"></figure>\n      <figure class="art event-card"><img src="bang-buy-bang-out.jpg?v=20260817-complete" alt="Bang N Buy Bang Out promotion"></figure>\n      <figure class="art event-card"><img src="bang-buy-black-rambo.jpg?v=20260817-complete" alt="Bang N Buy Black Rambo featured guest graphic"></figure>\n      <figure class="art event-card"><img src="bang-buy-nina.jpg?v=20260817-complete" alt="Bang N Buy Nina De La Flores featured guest graphic"></figure>\n      <figure class="art event-card"><img src="bang-buy-method.jpg?v=20260817-complete" alt="Bang N Buy Method Endeavors featured guest graphic"></figure>\n      <figure class="art event-card"><img src="bang-buy-sponsors.jpg?v=20260817-complete" alt="Bang N Buy vendors and sponsors graphic"></figure>\n    </div>'''

          html, count = re.subn(r'<div class="grid four" id="bangCampaign">.*?</div>', bang_grid, html, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError('Could not replace Bang N Buy campaign grid')

          # Remove the old browser-side base64 loader completely.
          html = re.sub(r'\s*<script>.*?data-b64-src.*?</script>', '', html, flags=re.S)

          if 'data-b64-src' in html:
              raise RuntimeError('Runtime image-loader references still remain')
          for required in [
              'clik-final-identity-board.jpg?v=20260817-complete',
              'clik-social-opening-day.jpg?v=20260817-complete',
              'clik-social-selection.jpg?v=20260817-complete',
              'clik-social-giveaway.jpg?v=20260817-complete',
              'bang-buy-teaser.jpg?v=20260817-complete',
              'bang-buy-event-logo.jpg?v=20260817-complete',
              'bang-buy-food-raffle.jpg?v=20260817-complete',
              'bang-buy-bang-out.jpg?v=20260817-complete',
              'bang-buy-black-rambo.jpg?v=20260817-complete',
              'bang-buy-nina.jpg?v=20260817-complete',
              'bang-buy-method.jpg?v=20260817-complete',
              'bang-buy-sponsors.jpg?v=20260817-complete',
          ]:
              if required not in html:
                  raise RuntimeError(f'Missing page reference: {required}')

          page.write_text(html, encoding='utf-8')
          PY

          file bang-buy-*.jpg
          rm -f .github/workflows/finalize-clik-page.yml

      - name: Commit finished CLIK page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo-clik-clik-bang.html bang-buy-*.jpg .github/workflows/finalize-clik-page.yml
          git commit -m "Complete CLIK case study image assets"
          git push origin HEAD:main
