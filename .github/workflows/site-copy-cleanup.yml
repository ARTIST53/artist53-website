name: Site Copy Cleanup

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '.github/workflows/site-copy-cleanup.yml'

permissions:
  contents: write

jobs:
  clean-copy:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove hyphenated words from visible copy
        shell: python
        run: |
          from pathlib import Path
          import re

          protected = re.compile(r'(<script\b.*?</script>|<style\b.*?</style>|<[^>]+>)', re.I | re.S)
          word_hyphen = re.compile(r'(?<=[A-Za-z])[-‐‑‒–](?=[A-Za-z])')
          changed = []

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              parts = protected.split(text)
              for i, part in enumerate(parts):
                  if part and not part.startswith('<'):
                      parts[i] = word_hyphen.sub(' ', part)
              cleaned = ''.join(parts)
              if cleaned != text:
                  path.write_text(cleaned, encoding='utf-8')
                  changed.append(str(path))

          print('Cleaned visible copy in:')
          for item in changed:
              print(item)

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No visible hyphenated words found."
            exit 0
          fi
          git config user.name "ARTIST53 Site Cleanup"
          git config user.email "actions@github.com"
          git add '*.html' '**/*.html'
          git commit -m "Clean hyphenated words from site copy [skip ci]"
          git push
