name: Install clean Manhood proof

on:
  push:
    paths:
      - '.github/workflows/install-manhood-proof.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install proof image and clean old files
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 2 'https://ucf2ff6a7a8e3a51135273202831.dl.dropboxusercontent.com/cd/0/get/DGOrCDA3aTLicTy6IEBRzUs2bBAFYMSf7RgTNL2imn-3qmonM-NpByANCKoGI9AenNpIwX6pbtVUcwB2snoEls_OdDyonhTL-NmHhWMDoec-jnEejISJv_L6fjwZ3P6guZCq5DGfzeA_zFJH7ZHEIZ2HvPoMtb8bNqsHIOzGHKiLhA/file?c_luid=f5ddbb2e' -o manhood-proof-board.png
          file manhood-proof-board.png
          test "$(wc -c < manhood-proof-board.png)" -gt 500000
          rm -f manhood-proof-board.webp manhood-proof.jpg
          python3 - <<'PY'
          from pathlib import Path
          p=Path('logo-manhood-basic-training.html')
          s=p.read_text()
          s=s.replace('manhood-proof-board.webp?v=20260814-proof3','manhood-proof-board.png?v=20260814-proof4')
          p.write_text(s)
          PY
          git config user.name 'ARTIST53 Site Build'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Use clean Manhood proof board image'
          git push
