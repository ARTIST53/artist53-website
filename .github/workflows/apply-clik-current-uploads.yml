name: Finalize CLIK current uploads
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-clik-current-uploads.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Decode verified social artwork
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, re
          pairs = {
              '.tmp-clik2/selection.b64': 'clik-social-selection.jpg',
              '.tmp-clik2/giveaway.b64': 'clik-social-giveaway.jpg',
          }
          for source, target in pairs.items():
              text = Path(source).read_text(encoding='utf-8', errors='ignore')
              text = re.sub(r'[^A-Za-z0-9+/=]', '', text)
              text += '=' * ((4 - len(text) % 4) % 4)
              data = base64.b64decode(text, validate=False)
              assert data[:3] == b'\xff\xd8\xff', f'{target} is not JPEG'
              assert data[-2:] == b'\xff\xd9', f'{target} is truncated'
              Path(target).write_bytes(data)
              print(target, len(data), 'bytes OK')
          PY
          file clik-social-selection.jpg clik-social-giveaway.jpg
      - name: Refresh CLIK image cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('logo-clik-clik-bang.html')
          s=p.read_text()
          s=s.replace('?v=20260816-1','?v=20260816-3')
          s=s.replace('?v=20260816-2','?v=20260816-3')
          p.write_text(s)
          PY
      - name: Remove temporary transfer files
        run: |
          rm -rf .asset-load-20260816 .tmp-clik .tmp-clik2 .tmp-clik3 .tmp-clik4
          rm -f .github/workflows/apply-clik-current-uploads.yml
      - name: Commit final CLIK assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize CLIK identity and social artwork'
          git push origin HEAD:main
