name: Finalize CLIK current uploads
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-clik-current-uploads.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Decode verified social artwork
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .tmp-clik2/selection.b64 > clik-social-selection.jpg
          base64 -d .tmp-clik2/giveaway.b64 > clik-social-giveaway.jpg
          file clik-social-selection.jpg clik-social-giveaway.jpg
          test -s clik-social-selection.jpg
          test -s clik-social-giveaway.jpg
          python - <<'PY'
          from pathlib import Path
          for name in ('clik-social-selection.jpg','clik-social-giveaway.jpg'):
              data=Path(name).read_bytes()
              assert data[:3] == b'\xff\xd8\xff', f'{name} is not JPEG'
              assert data[-2:] == b'\xff\xd9', f'{name} is truncated'
              print(name, len(data), 'bytes OK')
          PY
      - name: Refresh CLIK image cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('logo-clik-clik-bang.html')
          s=p.read_text()
          s=s.replace('?v=20260816-1','?v=20260816-3')
          s=s.replace('?v=20260816-2','?v=20260816-3')
          p.write_text(s)
          PY
      - name: Remove temporary transfer files
        run: |
          rm -rf .asset-load-20260816 .tmp-clik .tmp-clik2 .tmp-clik3 .tmp-clik4
          rm -f .github/workflows/apply-clik-current-uploads.yml
      - name: Commit final CLIK assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize CLIK identity and social artwork'
          git push origin HEAD:main
