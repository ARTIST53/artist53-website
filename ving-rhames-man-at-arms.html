<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ving Rhames as Man-At-Arms | ARTIST53</title><link rel="stylesheet" href="styles.css"><style>.ill-page .ill-hero{display:grid;grid-template-columns:.85fr 1.15fr;gap:42px;align-items:center}.ill-page .ill-copy h1{font-size:clamp(4.3rem,8vw,7.2rem);color:var(--yellow)}.ill-page .ill-copy p{color:var(--muted);line-height:1.7;font-size:1.08rem}.carousel{position:relative;aspect-ratio:1/1;background:#111;border:1px solid #2d2d2d;overflow:hidden}.carousel-slide{display:none;width:100%;height:100%;cursor:zoom-in}.carousel-slide.active{display:block}.carousel-slide img{width:100%;height:100%;object-fit:cover}.carousel button.nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:2rem;cursor:pointer;z-index:3}.carousel .prev{left:12px}.carousel .next{right:12px}.dots{display:flex;justify-content:center;gap:8px;margin-top:12px}.dots button{width:10px;height:10px;border-radius:50%;border:0;background:#555;padding:0}.dots button.active{background:var(--yellow)}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;z-index:100;padding:24px}.lightbox.open{display:flex}.lightbox img{max-width:94vw;max-height:92vh;width:auto;height:auto;object-fit:contain}.lightbox button{position:absolute;right:22px;top:18px;background:none;border:0;color:#fff;font-size:2.4rem;cursor:pointer}@media(max-width:800px){.ill-page .ill-hero{grid-template-columns:1fr}}</style></head><body class="ill-page"><header><div class="wrap nav"><a class="brand" href="index.html"><img src="artist53-wordmark.png" alt="ARTIST53"></a><div class="nav-dropdown"><button class="nav-trigger" id="navTrigger" type="button" aria-expanded="false" aria-controls="navMenu"><span class="nav-label">Navigation</span><span class="hamburger" aria-hidden="true"><i></i><i></i><i></i></span></button><nav class="dropdown-menu" id="navMenu"><a href="index.html">Home</a><a href="logo-design.html">Logo Design</a><a href="illustration.html" class="active">Illustration</a><a href="character-design.html">Character Design</a><a href="vector-lounge.html">The Vector Lounge</a><a href="learning.html">Learning</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></div></div></header><main><section><div class="wrap ill-hero"><div class="ill-copy"><p class="eyebrow">Concept Illustration</p><h1>Ving Rhames / Man-At-Arms</h1><p>Ving Rhames imagined as Man-At-Arms from Masters of the Universe.</p><a class="btn" href="illustration.html">Back To Illustration</a></div><div><div class="carousel" id="carousel"><div class="carousel-slide active" data-lightbox><img src="ving-rhames-man-at-arms-01.jpg" alt="Ving Rhames imagined as Man-At-Arms, first illustration"></div><div class="carousel-slide" data-lightbox><img src="ving-rhames-man-at-arms-02.jpg" alt="Ving Rhames imagined as Man-At-Arms, second illustration"></div><button class="nav prev" aria-label="Previous image">‹</button><button class="nav next" aria-label="Next image">›</button></div><div class="dots"><button class="active" aria-label="Show image 1"></button><button aria-label="Show image 2"></button></div></div></div></section></main><div class="lightbox" id="lightbox"><button aria-label="Close">×</button><img alt="Expanded artwork"></div><footer></footer><script src="script.js?v=20260822-illustration"></script><script>const slides=[...document.querySelectorAll('.carousel-slide')],dots=[...document.querySelectorAll('.dots button')];let i=0;function show(n){i=(n+slides.length)%slides.length;slides.forEach((s,x)=>s.classList.toggle('active',x===i));dots.forEach((d,x)=>d.classList.toggle('active',x===i))}document.querySelector('.prev').onclick=()=>show(i-1);document.querySelector('.next').onclick=()=>show(i+1);dots.forEach((d,x)=>d.onclick=()=>show(x));const lb=document.getElementById('lightbox'),lbImg=lb.querySelector('img');document.querySelectorAll('[data-lightbox]').forEach(el=>el.addEventListener('click',e=>{lbImg.src=e.currentTarget.querySelector('img').src;lb.classList.add('open')}));lb.addEventListener('click',e=>{if(e.target===lb||e.target.tagName==='BUTTON')lb.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('open');if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)});</script></body></html>
