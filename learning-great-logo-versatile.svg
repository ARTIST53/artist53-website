<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">VERSATILE: ARTIST53 and Mountain Bean logo comparison</title><desc id="desc">MANHOOD BASIC TRAINING demonstrates versatile. A polished fictional Mountain Bean comparison shows a weaker and stronger approach.</desc><style>.eyebrow{font:700 25px Arial,sans-serif;letter-spacing:4px}.headline{font:900 66px Arial,sans-serif}.project{font:800 31px Arial,sans-serif;letter-spacing:1px}.lesson{font:26px Arial,sans-serif}.label{font:800 22px Arial,sans-serif;letter-spacing:2px}.brand{font:800 25px Arial,sans-serif}.brandScript{font:italic 700 20px Georgia,serif}.small{font:700 16px Arial,sans-serif}.messy{font:italic 700 63px Georgia,serif}.tinySpace{font:18px Arial,sans-serif;letter-spacing:8px}.sale{font:900 27px Arial,sans-serif;fill:#fff}.sale2{font:800 20px Arial,sans-serif;fill:#fff}.strongBrand{font:900 31px Arial,sans-serif;letter-spacing:1px}.strongSub{font:18px Arial,sans-serif;letter-spacing:5px}</style><rect width="1200" height="1200" fill="#f5efe2"/><rect width="1200" height="190" fill="#080808"/><rect y="190" width="1200" height="9" fill="#ffc31c"/><text x="62" y="67" class="eyebrow" fill="#ffc31c">ARTIST53 LOGO LEARNING / 05</text><text x="62" y="145" class="headline" fill="#fff">VERSATILE</text><text x="1138" y="143" text-anchor="end" class="lesson" fill="#bdbdbd">Create a mark that survives every format</text><rect x="55" y="245" width="1090" height="340" rx="22" fill="#fff" stroke="#181818" stroke-width="4"/><rect x="55" y="245" width="420" height="340" rx="22" fill="#eee8dc"/><image href="manhood-system.jpg" x="82" y="272" width="366" height="286" preserveAspectRatio="xMidYMid meet"/><text x="520" y="325" class="label" fill="#9b7410">REAL ARTIST53 EXAMPLE</text><text x="520" y="385" class="project" fill="#111">MANHOOD BASIC TRAINING</text><text x="520" y="443" class="lesson" fill="#4f4f4f">Versatile is not decoration.</text><text x="520" y="484" class="lesson" fill="#4f4f4f">It is a performance requirement.</text><path d="M520 524h545" stroke="#ffc31c" stroke-width="7"/><rect x="55" y="630" width="525" height="505" rx="22" fill="#fff" stroke="#1b1b1b" stroke-width="4"/><rect x="620" y="630" width="525" height="505" rx="22" fill="#fff" stroke="#1b1b1b" stroke-width="4"/><rect x="55" y="630" width="525" height="64" rx="20" fill="#7e2828"/><rect x="620" y="630" width="525" height="64" rx="20" fill="#1d5e3b"/><text x="317" y="672" text-anchor="middle" class="label" fill="#fff">WEAK / DEPENDENT</text><text x="882" y="672" text-anchor="middle" class="label" fill="#fff">STRONG / ADAPTABLE</text><g transform="translate(300 850)"><rect x="-122" y="-122" width="244" height="244" rx="30" fill="#7153a5"/><path d="M-95 62 0-102 95 62" fill="#ff9b21"/><circle cy="16" r="51" fill="#00b2bd"/><path d="M-42 76h84" stroke="#f03a7d" stroke-width="18"/><text y="166" text-anchor="middle" class="small">COLOR + EFFECTS REQUIRED</text></g><g transform="translate(882 850) scale(1)"><circle cx="0" cy="0" r="122" fill="#c86f3d"/><path d="M-95 28 -28-42 4-10 48-62 100 4" fill="none" stroke="#152f27" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M18-108C-38-48-45 18-10 54C14 80 5 104-25 121" fill="none" stroke="#f6f0e2" stroke-width="15" stroke-linecap="round"/></g><text x="882" y="1032" text-anchor="middle" class="strongBrand" fill="#153c2d">MOUNTAIN BEAN</text><text x="882" y="1070" text-anchor="middle" class="strongSub" fill="#555">COFFEE</text><text x="600" y="1175" text-anchor="middle" class="eyebrow" fill="#111">REAL PROOF + FICTIONAL TEST</text></svg>