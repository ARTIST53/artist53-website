<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kill Bill | ARTIST53</title><link rel="stylesheet" href="styles.css"><style>.art{width:min(1180px,100%);margin:30px auto}.art img{display:block;width:100%;height:auto;cursor:zoom-in}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:18px}.details img{aspect-ratio:1;object-fit:cover}@media(max-width:700px){.details{grid-template-columns:1fr}}.lightbox{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:100}.lightbox.open{display:flex}.lightbox img{max-width:96vw;max-height:94vh}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img src="artist53-wordmark.png" alt="ARTIST53"></a></div></header><main><section><div class="wrap"><p class="eyebrow">Movies</p><h1 class="title">Kill Bill</h1><p>ARTIST53 interpretation inspired by Kill Bill.</p><a class="btn" href="illustration.html">Back To Illustration</a><div class="art"><img data-lightbox src="ElleDriver_KB_2014_web.jpg" alt="Kill Bill full illustration"><div class="details"><img data-lightbox src="ElleDriver_KB_2_2014_web.jpg" alt="Kill Bill portrait detail"><img data-lightbox src="IMG_20140522_181402_web.jpg" alt="Kill Bill eye patch detail"><img data-lightbox src="IMG_20140522_202610_web.jpg" alt="Kill Bill illustration alternate"><img data-lightbox src="IMG_20140522_202721_web.jpg" alt="Kill Bill syringe detail"></div></div></div></section></main><div class="lightbox" id="lb"><img alt="Expanded artwork"></div><footer></footer><script src="script.js"></script><script>const lb=document.getElementById('lb'),li=lb.querySelector('img');document.querySelectorAll('[data-lightbox]').forEach(i=>i.onclick=()=>{li.src=i.src;lb.classList.add('open')});lb.onclick=()=>lb.classList.remove('open');</script></body></html>
