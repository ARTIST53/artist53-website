<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venom | ARTIST53</title><meta name="description" content="Venom vector illustration by ARTIST53 with timelapse process video."><link rel="stylesheet" href="styles.css?v=20260830-image-viewer-2"><style>.video-feature{width:min(1180px,calc(100% - 40px));margin:34px auto 54px;background:#000}.video-label{margin:0 0 14px;font-size:1.05rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.video-frame{width:100%;aspect-ratio:1/1;background:#000;overflow:hidden}.video-frame video{display:block;width:100%;height:100%;object-fit:cover;background:#000}.art{width:min(1180px,calc(100% - 40px));margin:0 auto 40px}.final-art{margin-bottom:22px}.final-art img{display:block;width:100%;height:auto;cursor:zoom-in}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.details img{display:block;width:100%;height:auto;cursor:zoom-in}@media(max-width:700px){.details{grid-template-columns:1fr}.video-feature,.art{width:min(100% - 24px,1180px)}}.lightbox{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:100}.lightbox.open{display:flex}.lightbox img{max-width:96vw;max-height:94vh}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img src="artist53-wordmark.png" alt="ARTIST53"></a></div></header><main><section><div class="wrap"><p class="eyebrow">Comics / Marvel</p><h1 class="title">Venom</h1><a class="btn" href="illustration.html">Back To Illustration</a></div><div class="video-feature"><p class="video-label">Illustration Video</p><div class="video-frame"><video controls playsinline preload="metadata" poster="ill-venom.png"><source src="venom-timelapse.mp4" type="video/mp4">Your browser does not support video playback.</video></div></div><div class="art"><div class="final-art"><img data-lightbox src="ill-venom.png" alt="Venom final vector illustration by ARTIST53"></div><div class="details"><img data-lightbox src="venom-addition-web.jpg" alt="Venom supporting close-up illustration"></div></div></section></main><div class="lightbox" id="lb"><img alt="Expanded artwork"></div><footer></footer><script src="script.js?v=20260830-image-viewer-2"></script><script>const lb=document.getElementById('lb'),li=lb.querySelector('img');document.querySelectorAll('[data-lightbox]').forEach(i=>i.onclick=()=>{li.src=i.src;lb.classList.add('open')});lb.onclick=()=>lb.classList.remove('open');</script></body></html>
