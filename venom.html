<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venom | ARTIST53</title><meta name="description" content="Venom vector illustration by ARTIST53 with timelapse process video."><link rel="stylesheet" href="styles.css"><style>.ill-page .ill-hero{display:grid;grid-template-columns:1fr;gap:34px;align-items:start}.ill-page .ill-copy{max-width:1000px}.ill-page .ill-art,.ill-page .ill-detail{width:min(1180px,100%);margin:0 auto;background:#111;border:1px solid #2d2d2d;overflow:hidden;cursor:zoom-in}.ill-page .ill-detail{margin-top:18px}.ill-page .ill-art img,.ill-page .ill-detail img{display:block;width:100%;height:auto}.ill-page .ill-copy h1{font-size:clamp(4.8rem,9vw,8rem);color:var(--yellow)}.ill-page .video-shell{width:min(1100px,100%);margin:30px auto 0;background:#000;border:1px solid #2d2d2d}.ill-page video{display:block;width:100%;height:auto}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}.lightbox.open{display:flex}.lightbox img{max-width:98vw;max-height:96vh}.lightbox button{position:absolute;right:20px;top:16px;background:#000;border:2px solid #fff;color:#fff;font-size:2.5rem;width:52px;height:52px}</style></head><body class="ill-page"><header><div class="wrap nav"><a class="brand" href="index.html"><img src="artist53-wordmark.png" alt="ARTIST53"></a></div></header><main><section><div class="wrap ill-hero"><div class="ill-copy"><p class="eyebrow">Comics / Marvel</p><h1>Venom</h1><a class="btn" href="illustration.html">Back To Illustration</a></div><div class="ill-art" data-lightbox><img src="ill-venom.png" alt="Venom vector illustration by ARTIST53"></div><div class="ill-detail" data-lightbox><img src="venom-addition-web.jpg" alt="Venom close-up illustration"></div></div></section><section><div class="wrap"><p class="eyebrow">Process</p><h2 class="title">Timelapse</h2><div class="video-shell"><video controls playsinline preload="metadata" poster="ill-venom.png"><source src="venom-timelapse.mp4" type="video/mp4"></video></div></div></section></main><div class="lightbox" id="lightbox"><button aria-label="Close">×</button><img alt="Expanded artwork"></div><footer></footer><script src="script.js"></script><script>const lb=document.getElementById('lightbox'),lbImg=lb.querySelector('img');document.querySelectorAll('[data-lightbox]').forEach(el=>el.onclick=()=>{lbImg.src=el.querySelector('img').src;lb.classList.add('open')});lb.onclick=e=>{if(e.target===lb||e.target.tagName==='BUTTON')lb.classList.remove('open')};</script></body></html>
